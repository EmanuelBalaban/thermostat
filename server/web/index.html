<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thermostat Project</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
<header>Thermostat Project</header>
<div class="content">
    <div class="temperature-display">
        <div class="slider-container">
            <svg width="200" height="200" viewBox="0 0 200 200">
                <!-- Track circle -->
                <circle class="slider-track" cx="100" cy="100" r="90"></circle>
                <!-- Progress circle -->
                <circle class="slider-progress" cx="100" cy="100" r="90" stroke-dasharray="565.48"
                        stroke-dashoffset="0"></circle>
                <!-- Handle (moving circle) -->
                <circle class="slider-handle" cx="190" cy="100" r="10"></circle>
            </svg>
        </div>
        <div class="temperature-value">--°C</div>
        <div class="desired-temperature">--°C</div>
        <span class="fire-icon" style="display: none;">🔥</span>
        <span class="warning-icon" style="display: none;">⚠️</span>
    </div>
    <div class="switch">
        <button id="heating-button" class="off">Heating Off</button>
    </div>
</div>
</body>
</html>
